# مراقبة ReapX من خارج Cloudflare · كل ٥ دقائق · مستودع عامّ = دقائق Actions مجانية بلا حدّ
# أي فحص يسقط ٣ مرّات متتالية (بفاصل ٢٠ ثانية) يُفشل التشغيل فيصل بريد GitHub «Run failed» لصاحب الحساب
# لا أسرار هنا: الروابط الأربعة عامّة أصلًا
name: ReapX uptime
on:
  schedule:
    # 4,9,14,…,59 · صيغة الخطوة الموثقة لدى GitHub وتبتعد عن الدقيقة 0
    - cron: "4/5 * * * *"
  workflow_dispatch:
    inputs:
      test_failure:
        description: "اختبار التنبيه: يُفشل التشغيل عمدًا ليصل بريد Run failed (لا يفحص الروابط)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: uptime
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: اختبار التنبيه (يدوي فقط)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_failure }}
        run: |
          echo "::error title=اختبار تنبيه::تشغيل مقصود للتأكّد من وصول بريد Run failed · الخدمات لم تُفحص"
          exit 1
      - name: فحص الخدمة واللوحة وصفحة الزبون والشاشة
        shell: bash
        run: |
          set -u
          down=0
          probe() {
            local name="$1" url="$2" want="$3" body code i
            for i in 1 2 3; do
              body=$(curl -sS -L --max-time 20 -H 'Cache-Control: no-cache' -w '\n__HTTP__%{http_code}' "$url" 2>/dev/null || true)
              code="${body##*__HTTP__}"
              if [ "$code" = "200" ] && printf '%s' "$body" | grep -qF -- "$want"; then
                echo "✓ $name · $code"; return 0
              fi
              [ $i -lt 3 ] && sleep 20
            done
            echo "::error title=$name متوقّف::$url → HTTP ${code:-000} (المتوقّع 200 وفيه: $want)"
            down=1
          }
          probe "الخدمة (مع الدورة الخلفية)" "https://reapx.thetasterspage.workers.dev/health?strict=1" '"ok":true'
          probe "لوحة المالك"               "https://reapx-panel.pages.dev/login.html"                 'ReapX'
          probe "صفحة الزبون"               "https://reapx-qr.pages.dev/pager"                         'REAPX_PAGER'
          probe "تطبيق الشاشة"              "https://reapx-app.pages.dev/"                             'src="app.js"'
          if [ $down -ne 0 ]; then echo "✗ خدمة أو أكثر متوقّفة"; exit 1; fi
          echo "✓ الأربع سليمة · $(date -u +%FT%TZ)"
